name: CMS runtime checks
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'server.mjs'
      - 'cms-*.json'
      - 'cms-runtime.test.mjs'
      - 'thumbnail-runtime.test.mjs'
      - 'editor-runtime.test.mjs'
      - 'editor-browser.test.mjs'
      - 'truston-template.test.mjs'
      - 'shared-catalog.test.mjs'
      - 'drive-thumbnail.mjs'
      - 'package*.json'
      - 'public/**'
      - '.github/workflows/cms-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check server.mjs
      - run: node --check drive-thumbnail.mjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node --test editor-browser.test.mjs
      - run: docker build --tag brand-asset-cms:test .
